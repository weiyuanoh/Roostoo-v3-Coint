[project]
name = "roostoo-stat-arb-bot"
version = "0.1.0"
description = "Infrastructure for a Roostoo long-short statistical-arbitrage bot"
readme = "README.md"
authors = [
    {name = "weiyuanoh"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]

[project.scripts]
stat-arb-bot = "stat_arb_bot.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "stat_arb_bot", from = "src"}]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
